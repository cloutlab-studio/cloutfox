name: Idea
description: Suggest a new feature
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem it solves
      placeholder: "I want to launch ten profiles on a schedule; right now I have to..."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
  - type: textarea
    id: alternatives
    attributes:
      label: How you get by today
