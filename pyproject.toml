[project]
name = "cloutfox"
version = "3.0.0"
description = "Anti-detect browser profile manager for Camoufox"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cloutlab" }]
keywords = ["anti-detect", "browser-profiles", "camoufox", "fingerprint", "proxy", "mcp"]
# Runtime dependencies live in requirements.txt (this is an application, not a library).

[project.urls]
Homepage = "https://github.com/cloutlab-studio/cloutfox"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "camoufox_data", "logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "B008",  # FastAPI declares dependencies as Depends(...) defaults
    "E501",  # line length is handled by the formatter
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "chrome_engine/tests"]

[tool.ruff.lint.per-file-ignores]
# Standalone scripts that drive a running CloutFox; one must edit sys.path first.
"tests/e2e/*.py" = ["E402"]
"chrome_engine/e2e/*.py" = ["E402"]
"chrome_engine/runner.py" = ["E402"]
